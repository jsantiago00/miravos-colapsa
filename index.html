<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#141d3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="¡Colapsá!">
<title>Mirá Vos · ¡Colapsá!</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23141d3a'/%3E%3Cpath d='M6 32Q32 6 58 32Q32 58 6 32Z' fill='none' stroke='%23f3eee2' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='11' fill='%237fb0e3'/%3E%3Ccircle cx='32' cy='32' r='6.5' fill='%23141d3a'/%3E%3Cpath d='M32 27l-4 4.5h2.6V37h2.8v-5.5H36z' fill='%23f3eee2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #141d3a;
    --navy-2: #1b2648;
    --navy-3: #0f1630;
    --line: #2c3961;
    --cream: #f3eee2;
    --muted: #9aa6c7;
    --sky: #7fb0e3;
    --orange: #e9a23b;
    --violet: #6d4fa3;
    --red: #e0473c;
    --cyan: #2fd3dc;
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --serif: "Fraunces", Georgia, serif;
    --sans: "Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--navy); color: var(--cream);
    font: 15px/1.3 var(--sans);
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
  }
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  /* ---------- Escenario ---------- */
  #stage {
    position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden;
    background:
      repeating-radial-gradient(circle at 50% 55%, transparent 0 46px, #ffffff0d 46px 47px),
      var(--navy);
  }
  #view {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; display: block;
  }

  header {
    position: absolute; top: 0; left: 0; right: 0;
    padding: calc(var(--sat) + 10px) calc(var(--sar) + 14px) 18px calc(var(--sal) + 14px);
    display: flex; align-items: center; gap: 10px;
    background: linear-gradient(#141d3af2, #141d3a00);
    pointer-events: none;
  }
  header svg { width: 44px; height: 28px; flex: none; }
  .brand { display: flex; flex-direction: column; line-height: 1; }
  .brand b { font: 900 22px/1 var(--serif); letter-spacing: -.01em; }
  .brand small {
    margin-top: 4px; font-size: 10px; font-weight: 500; letter-spacing: .32em;
    color: var(--sky); text-transform: uppercase;
  }
  header .spacer { flex: 1; }
  #status {
    font-size: 12px; padding: 4px 10px; border-radius: 999px;
    border: 1px solid #7fb0e366; color: var(--sky); white-space: nowrap;
  }
  #status.live::before {
    content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--orange); margin-right: 6px; vertical-align: 1px;
    animation: blink 1.4s infinite;
  }
  #status.collapsed { background: var(--orange); border-color: var(--orange); color: var(--navy); font-weight: 700; }
  @keyframes blink { 50% { opacity: .25; } }

  #caption {
    position: absolute; left: 0; right: 0; bottom: 14px; text-align: center;
    font-size: 13px; color: var(--cream); pointer-events: none; padding: 0 16px;
    text-shadow: 0 1px 6px #000c;
  }
  #caption em { color: var(--orange); font-style: normal; font-weight: 700; }

  /* Onda de "colapso" al cambiar de filtro */
  #wave {
    position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px;
    border-radius: 50%; border: 3px solid var(--cream); opacity: 0; pointer-events: none;
  }
  #wave.go { animation: wave .55s ease-out; }
  @keyframes wave {
    0% { transform: scale(.4); opacity: .9; }
    100% { transform: scale(14); opacity: 0; }
  }

  #toast {
    position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%) scale(.95);
    background: var(--cream); color: var(--navy); border-radius: 14px;
    padding: 12px 18px; font-size: 15px; font-weight: 500; text-align: center;
    box-shadow: 0 8px 30px #0008;
    opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; max-width: 85%;
  }
  #toast b { font-family: var(--serif); font-weight: 900; display: block; font-size: 18px; margin-bottom: 2px; }
  #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  /* ---------- Panel ---------- */
  #panel {
    flex: 0 0 auto; background: var(--navy-3); border-top: 1px solid var(--line);
    padding: 12px calc(var(--sar) + 12px) calc(var(--sab) + 12px) calc(var(--sal) + 12px);
    display: flex; flex-direction: column; gap: 10px;
  }
  #filters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .filter {
    min-height: 78px; border-radius: 16px; border: 2px solid var(--line);
    background: var(--navy-2); color: var(--cream); font: inherit; text-align: left;
    display: flex; align-items: center; gap: 12px; padding: 10px 14px;
    transition: background .15s, border-color .15s;
  }
  .gate {
    flex: none; width: 38px; height: 38px; border-radius: 50%;
    display: grid; place-items: center; font: 900 17px/1 var(--serif); color: #fff;
  }
  .filter[data-f="red"] .gate { background: var(--red); }
  .filter[data-f="cyan"] .gate { background: var(--cyan); color: var(--navy); }
  .filter .txt { display: flex; flex-direction: column; gap: 3px; }
  .filter .txt b { font: 900 21px/1 var(--serif); }
  .filter .txt small { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
  .filter[data-f="red"].active { border-color: var(--red); background: #3b1d2c; }
  .filter[data-f="cyan"].active { border-color: var(--cyan); background: #123947; }
  .filter.active .txt small { color: var(--cream); }

  #actions { display: grid; grid-template-columns: 1.35fr 1fr 1fr; gap: 8px; }
  .btn {
    min-height: 48px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--navy-2); color: var(--cream); font: 700 14px var(--sans); padding: 0 6px;
  }
  .btn.primary { background: var(--cream); color: var(--navy); border-color: var(--cream); }
  .btn.on { background: var(--orange); color: var(--navy); border-color: var(--orange); }
  .btn:disabled { opacity: .35; }
  .btn:active, .filter:active, .chip:active { transform: scale(.97); }

  #tools { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .chip {
    min-height: 34px; border-radius: 999px; border: 1px solid var(--line);
    background: transparent; color: var(--muted); font: 500 12px var(--sans); letter-spacing: .04em;
  }
  .chip.on { border-color: var(--sky); color: var(--cream); background: #7fb0e322; }
  #fileInput { display: none; }

  @media (min-width: 700px) {
    #panel { max-width: 560px; width: 100%; margin: 0 auto; border-radius: 18px 18px 0 0; border: 1px solid var(--line); }
  }
  @media (orientation: landscape) and (max-height: 500px) {
    body { flex-direction: row; }
    #panel { width: 270px; border-top: 0; border-left: 1px solid var(--line); justify-content: center;
             padding-top: calc(var(--sat) + 12px); }
    #filters { grid-template-columns: 1fr; }
    .filter { min-height: 62px; }
    #actions { grid-template-columns: 1fr 1fr; }
    #camBtn { grid-column: span 2; }
  }
</style>
</head>
<body>

<div id="stage">
  <canvas id="view"></canvas>
  <div id="wave"></div>
  <header>
    <svg viewBox="0 0 66 42" aria-hidden="true">
      <path d="M3 21Q33 -5 63 21Q33 47 3 21Z" fill="none" stroke="#f3eee2" stroke-width="3.5" stroke-linejoin="round"/>
      <circle cx="33" cy="21" r="11" fill="#7fb0e3"/>
      <circle cx="33" cy="21" r="6.5" fill="#141d3a"/>
      <path d="M33 16.3l-4 4.4h2.6v5h2.8v-5H37z" fill="#f3eee2"/>
    </svg>
    <div class="brand"><b>Mirá Vos</b><small>¡Colapsá!</small></div>
    <span class="spacer"></span>
    <span id="status">demo</span>
  </header>
  <div id="caption"></div>
  <div id="toast"></div>
</div>

<div id="panel">
  <div id="filters">
    <button class="filter" data-f="red">
      <span class="gate">R</span>
      <span class="txt"><b>Rojo</b><small>medir en eje rojo</small></span>
    </button>
    <button class="filter" data-f="cyan">
      <span class="gate">C</span>
      <span class="txt"><b>Cian</b><small>medir en eje cian</small></span>
    </button>
  </div>
  <div id="actions">
    <button class="btn primary" id="camBtn">Encender detector</button>
    <button class="btn" id="freezeBtn" disabled>Colapsar</button>
    <button class="btn" id="photoBtn">Sacar foto</button>
  </div>
  <div id="tools">
    <button class="chip" data-opt="thresh">Umbral</button>
    <button class="chip" data-opt="debug">Debug</button>
  </div>
  <input type="file" id="fileInput" accept="image/*" capture="environment">
</div>

<video id="video" playsinline muted autoplay style="display:none"></video>

<script>
(() => {
  'use strict';

  const MAX_SIDE = 720;
  const GUIDE = 0.72;       // lado del recuadro guía, fracción del lado menor del cuadro
  const PROC_MAX = 320;     // resolución a la que se procesa la carta
  const CARD_MM = 40;       // el recuadro guía es la carta cortada
  const CORNER = 0.275;     // esquinas que se ignoran (ahí va la marca del ojo)
  const EDGE = 0.05;        // franja del borde que se ignora
  const MARK_MM = 5.6;      // centro de la marca, desde el borde de la carta

  const QUIPS_COLLAPSE = [
    'Medido. Ahora la flecha no se mueve.',
    'El estado quedó definido.',
    'Lo que medís, queda.',
    'Ni el gato de Schrödinger se movió.',
  ];
  const QUIPS_FILTER = {
    red: ['Medido en eje rojo', 'Lo cian se apaga. Mirá vos.'],
    cyan: ['Medido en eje cian', 'Lo rojo se apaga. Mirá vos.'],
  };

  const $ = id => document.getElementById(id);
  const view = $('view');
  const vctx = view.getContext('2d');
  const work = document.createElement('canvas');
  const wctx = work.getContext('2d', { willReadFrequently: true });
  const proc = document.createElement('canvas');
  const pctx = proc.getContext('2d', { willReadFrequently: true });
  const video = $('video');

  const state = {
    filter: null,       // null | 'red' | 'cyan'
    source: 'demo',     // 'demo' | 'camera' | 'photo'
    frozen: false,
    stream: null,
    thresh: false,      // umbral binario en vez de grises
    debug: false,       // crudo · descorrelado · final, lado a lado
  };

  let raw = null;       // ImageData del frame original

  const pick = arr => arr[(Math.random() * arr.length) | 0];

  let toastTimer;
  function toast(title, msg = '', ms = 1800) {
    const t = $('toast');
    t.innerHTML = '';
    const b = document.createElement('b');
    b.textContent = title;
    t.append(b, msg);
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), ms);
  }

  function wave() {
    const w = $('wave');
    w.classList.remove('go');
    void w.offsetWidth;
    w.classList.add('go');
  }

  function updateLabels() {
    const s = $('status');
    s.className = '';
    if (state.source === 'camera') {
      s.textContent = state.frozen ? 'colapsado' : 'en vivo';
      s.classList.add(state.frozen ? 'collapsed' : 'live');
    } else {
      s.textContent = state.source === 'demo' ? 'demo' : 'foto';
    }

    const c = $('caption');
    if (state.source === 'demo' && !state.filter) {
      c.innerHTML = 'Hay dos flechas escondidas. <em>Tocá Rojo o Cian</em> para verlas.';
    } else if (state.source === 'camera' && !state.filter) {
      c.innerHTML = 'Encuadrá la carta en el recuadro, <em>con el ojo arriba a la izquierda</em>.';
    } else if (!state.debug) {
      c.textContent = '';
    }
  }

  function setSize(w, h) {
    const k = Math.min(1, MAX_SIDE / Math.max(w, h));
    const W = Math.max(1, Math.round(w * k)), H = Math.max(1, Math.round(h * k));
    if (work.width !== W || work.height !== H) {
      work.width = W; work.height = H;
    }
  }

  function guideRect(W, H) {
    const s = Math.round(Math.min(W, H) * GUIDE);
    return { x: (W - s) >> 1, y: (H - s) >> 1, s };
  }

  // ---------- Procesamiento de la carta ----------
  // Buffers de trabajo, uno por tamaño de procesamiento.
  // ignore marca lo que no entra en ajustes ni percentiles: las esquinas (marca
  // del ojo) y una franja en el borde (mesa o cartas vecinas por mal encuadre).
  let buf = null;
  function buffers(P) {
    if (buf && buf.P === P) return buf;
    const n = P * P, f = () => new Float32Array(n);
    const ignore = new Uint8Array(n), k = Math.round(P * CORNER), e = Math.round(P * EDGE);
    for (let y = 0; y < P; y++) {
      for (let x = 0; x < P; x++) {
        const inCorner = (x < k || x >= P - k) && (y < k || y >= P - k);
        const onEdge = x < e || x >= P - e || y < e || y >= P - e;
        ignore[y * P + x] = inCorner || onEdge ? 1 : 0;
      }
    }
    buf = { P, n, S: f(), N: f(), D: f(), F: f(), M1: f(), M2: f(), tmp: f(), ignore,
            img: pctx.createImageData(P, P) };
    return buf;
  }

  // Promedio móvil en una dirección, replicando el borde
  function boxPass(src, dst, P, r, horiz) {
    const step = horiz ? 1 : P, lstep = horiz ? P : 1, inv = 1 / (2 * r + 1), last = P - 1;
    for (let l = 0; l < P; l++) {
      const base = l * lstep;
      let acc = src[base] * (r + 1);
      for (let i = 1; i <= r; i++) acc += src[base + Math.min(i, last) * step];
      for (let i = 0; i < P; i++) {
        dst[base + i * step] = acc * inv;
        acc += src[base + Math.min(i + r + 1, last) * step] - src[base + Math.max(i - r, 0) * step];
      }
    }
  }

  // Tres pasadas de caja ≈ gaussiana de desvío sigma. El resultado queda en a.
  function blur(a, tmp, P, sigma) {
    const r = Math.max(1, Math.round((Math.sqrt(4 * sigma * sigma + 1) - 1) / 2));
    for (let k = 0; k < 3; k++) {
      boxPass(a, tmp, P, r, true);
      boxPass(tmp, a, P, r, false);
    }
  }

  function meanOutside(a, ignore) {
    let s = 0, c = 0;
    for (let p = 0; p < a.length; p++) if (!ignore[p]) { s += a[p]; c++; }
    return s / c;
  }

  function percentiles(a, ignore, plo, phi) {
    const s = [];
    for (let p = 0; p < a.length; p += 3) if (!ignore[p]) s.push(a[p]);
    s.sort((x, y) => x - y);
    return [s[Math.floor(s.length * plo)], s[Math.min(s.length - 1, Math.floor(s.length * phi))]];
  }

  // Pendiente local de S contra N, en ventanas gaussianas de desvío sigma:
  //   a(x) = cov(S, N) / var(N)
  // La flecha cambia esa pendiente adentro y afuera. La luz multiplica S y N
  // por igual, así que la pendiente no cambia con la iluminación, y el cruce de
  // tinta que meta la impresión es el mismo en toda la carta: solo corre el fondo.
  // Resultado en D.
  function localSlope(b, sigma) {
    const { P, n, S, N, D, F, M1, M2, tmp } = b;
    F.set(S); blur(F, tmp, P, sigma);                       // E[S]
    D.set(N); blur(D, tmp, P, sigma);                       // E[N]
    for (let p = 0; p < n; p++) { M1[p] = S[p] * N[p]; M2[p] = N[p] * N[p]; }
    blur(M1, tmp, P, sigma);                                // E[SN]
    blur(M2, tmp, P, sigma);                                // E[N²]
    for (let p = 0; p < n; p++) {
      const mn = D[p];
      D[p] = (M1[p] - F[p] * mn) / (M2[p] - mn * mn + 1);
    }
  }

  // Estira entre percentiles y pinta con el color del filtro
  function paint(a, b, plo, phi, binary) {
    const { n, ignore, img } = b, o = img.data, red = state.filter === 'red';
    let [lo, hi] = percentiles(a, ignore, plo, phi);
    if (hi - lo < 1e-6) hi = lo + 1;
    const k = 255 / (hi - lo);
    let thr = -1;
    if (binary) {
      // Umbral de Otsu sobre los valores ya estirados
      const hist = new Float64Array(256);
      for (let p = 0; p < n; p++) {
        if (ignore[p]) continue;
        const v = (a[p] - lo) * k;
        hist[v < 0 ? 0 : v > 255 ? 255 : v | 0]++;
      }
      let tot = 0, sum = 0;
      for (let i = 0; i < 256; i++) { tot += hist[i]; sum += i * hist[i]; }
      let w0 = 0, s0 = 0, best = -1;
      for (let i = 0; i < 256; i++) {
        w0 += hist[i]; s0 += i * hist[i];
        if (!w0 || w0 === tot) continue;
        const m0 = s0 / w0, m1 = (sum - s0) / (tot - w0), bv = w0 * (tot - w0) * (m0 - m1) ** 2;
        if (bv > best) { best = bv; thr = i; }
      }
    }
    for (let p = 0, i = 0; p < n; p++, i += 4) {
      let v = (a[p] - lo) * k;
      v = v < 0 ? 0 : v > 255 ? 255 : v;
      if (thr >= 0) v = v > thr ? 255 : 0;
      const t = v * 0.3;
      if (red) { o[i] = v; o[i + 1] = t; o[i + 2] = t; }
      else { o[i] = t; o[i + 1] = v; o[i + 2] = v; }
      o[i + 3] = 255;
    }
    pctx.putImageData(img, 0, 0);
  }

  // Pipeline sobre el recuadro guía. Por cada etapa pedida ('raw' = canal crudo,
  // 'carrier' = portadora G − B, 'final') pinta el resultado en `proc` y llama a draw.
  function processCard(g, stages, draw) {
    const P = Math.min(g.s, PROC_MAX), mm = P / CARD_MM;
    if (proc.width !== P) { proc.width = P; proc.height = P; }
    pctx.drawImage(work, g.x, g.y, g.s, g.s, 0, 0, P, P);
    const px = pctx.getImageData(0, 0, P, P).data;
    const b = buffers(P), { n, S, N, D, F, tmp, ignore } = b;

    // 1. Canal oculto (S) y portadora (N = G − B, el laberinto visible)
    const red = state.filter === 'red';
    for (let p = 0, i = 0; p < n; p++, i += 4) {
      S[p] = red ? px[i] : (px[i + 1] + px[i + 2]) / 2;
      N[p] = px[i + 1] - px[i + 2];
    }

    // 2. Pendiente local de S contra N (ventana de 1,5 mm)
    localSlope(b, 1.5 * mm);

    // 3. La flecha es la minoría (~15% de la carta): se deja oscura sobre fondo
    //    claro. Lo ignorado (marca, borde) se rellena con la mediana y se
    //    suaviza un poco más.
    const [p05, p50, p90] = [0.05, 0.5, 0.9].map(q => percentiles(D, ignore, q, q)[0]);
    const flip = p50 - p05 < p90 - p50 ? -1 : 1;
    for (let p = 0; p < n; p++) F[p] = ignore[p] ? p50 * flip : D[p] * flip;
    blur(F, tmp, P, 0.75 * mm);

    // Señal/ruido: distancia flecha–fondo sobre la dispersión del fondo
    const [q05, q50, q75] = [0.05, 0.5, 0.75].map(q => percentiles(F, ignore, q, q)[0]);
    const snr = (q50 - q05) / Math.max(1e-9, (q75 - q50) / 0.674);

    // 4. Estiramiento por percentiles (o umbral) y salida
    for (const st of stages) {
      if (st === 'raw') paint(S, b, 0.01, 0.99, false);
      else if (st === 'carrier') paint(N, b, 0.01, 0.99, false);
      else paint(F, b, 0.02, 0.98, state.thresh);
      draw(st, P);
    }
    return { snr };
  }

  function drawGuide(g) {
    vctx.save();
    vctx.strokeStyle = '#f3eee2';
    vctx.lineWidth = 2;
    vctx.setLineDash([10, 7]);
    vctx.strokeRect(g.x + 0.5, g.y + 0.5, g.s - 1, g.s - 1);
    // Dónde tiene que quedar el ojo
    vctx.setLineDash([]);
    vctx.globalAlpha = 0.8;
    const m = g.s * MARK_MM / CARD_MM;
    vctx.beginPath();
    vctx.ellipse(g.x + m, g.y + m, g.s * 4.75 / CARD_MM, g.s * 2.8 / CARD_MM, 0, 0, Math.PI * 2);
    vctx.stroke();
    vctx.restore();
  }

  function snrText(r) {
    return `señal/ruido ${r.snr.toFixed(1)}`;
  }

  function loadStatic(img, w, h) {
    setSize(w, h);
    wctx.drawImage(img, 0, 0, work.width, work.height);
    raw = wctx.getImageData(0, 0, work.width, work.height);
    render();
  }

  // Filtro rojo: lee R, donde está la flecha vertical.
  // Filtro cian: lee (G+B)/2, donde está la flecha horizontal.
  // Las flechas están escondidas en cómo esos canales siguen al laberinto (G − B).
  function render() {
    if (!raw) return;
    const W = work.width, H = work.height, g = guideRect(W, H);

    if (state.filter && state.debug) {
      // Tres paneles: en fila si la pantalla es ancha, en columna si es alta
      const stage = $('stage'), wide = stage.clientWidth >= stage.clientHeight;
      const P = Math.min(g.s, PROC_MAX), gap = 8, lab = 22;
      const VW = wide ? 3 * P + 2 * gap : P, VH = wide ? P + lab : 3 * (P + lab) + 2 * gap;
      if (view.width !== VW || view.height !== VH) { view.width = VW; view.height = VH; }
      vctx.fillStyle = '#0f1630';
      vctx.fillRect(0, 0, VW, VH);
      vctx.font = '500 13px "Space Grotesk", system-ui, sans-serif';
      vctx.fillStyle = '#9aa6c7';
      const names = { raw: 'crudo', carrier: 'portadora (G − B)', final: 'final' };
      let k = 0;
      const res = processCard(g, ['raw', 'carrier', 'final'], st => {
        const x = wide ? k * (P + gap) : 0, y = wide ? 0 : k * (P + lab + gap);
        vctx.drawImage(proc, x, y + lab);
        vctx.fillText(names[st], x + 2, y + 15);
        k++;
      });
      $('caption').textContent = snrText(res);
      return;
    }

    if (view.width !== W || view.height !== H) { view.width = W; view.height = H; }
    vctx.putImageData(raw, 0, 0);
    if (state.filter) {
      vctx.fillStyle = 'rgba(15, 22, 48, .72)';
      vctx.fillRect(0, 0, W, H);
      processCard(g, ['final'], (st, P) => {
        vctx.imageSmoothingEnabled = true;
        vctx.drawImage(proc, 0, 0, P, P, g.x, g.y, g.s, g.s);
      });
    }
    drawGuide(g);
  }

  function loop() {
    if (state.source === 'camera' && !state.frozen && video.readyState >= 2 && video.videoWidth) {
      setSize(video.videoWidth, video.videoHeight);
      wctx.drawImage(video, 0, 0, work.width, work.height);
      raw = wctx.getImageData(0, 0, work.width, work.height);
      render();
    }
    requestAnimationFrame(loop);
  }

  // ---------- Filtros ----------
  document.querySelectorAll('.filter').forEach(btn => {
    btn.addEventListener('click', () => {
      // Tocar el filtro activo lo apaga
      state.filter = state.filter === btn.dataset.f ? null : btn.dataset.f;
      document.querySelectorAll('.filter').forEach(b => b.classList.toggle('active', b.dataset.f === state.filter));
      if (state.filter) {
        wave();
        const [title, msg] = QUIPS_FILTER[state.filter];
        toast(title, msg, 1200);
      }
      updateLabels();
      render();
    });
  });

  document.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      const k = btn.dataset.opt;
      state[k] = !state[k];
      btn.classList.toggle('on', state[k]);
      updateLabels();
      render();
    });
  });

  // ---------- Cámara ----------
  async function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      toast('Sin detector', 'La cámara no está disponible. Usá "Sacar foto".', 3500);
      return;
    }
    $('camBtn').disabled = true;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
      });
      state.stream = stream;
      video.srcObject = stream;
      await video.play();
      state.source = 'camera';
      setFrozen(false);
      $('camBtn').textContent = 'Apagar detector';
      $('camBtn').classList.remove('primary');
      $('freezeBtn').disabled = false;
    } catch (err) {
      console.error(err);
      toast('Detector bloqueado', err && err.name === 'NotAllowedError'
        ? 'Sin permiso de cámara. Podés usar "Sacar foto".'
        : 'No se pudo abrir la cámara. Probá con "Sacar foto".', 3500);
    } finally {
      $('camBtn').disabled = false;
      updateLabels();
    }
  }

  function stopCamera() {
    if (state.stream) state.stream.getTracks().forEach(t => t.stop());
    state.stream = null;
    video.srcObject = null;
    $('camBtn').textContent = 'Encender detector';
    $('camBtn').classList.add('primary');
    $('freezeBtn').disabled = true;
    setFrozen(false);
  }

  function setFrozen(f) {
    state.frozen = f;
    const b = $('freezeBtn');
    b.textContent = f ? 'Seguir' : 'Colapsar';
    b.classList.toggle('on', f);
    updateLabels();
  }

  $('camBtn').addEventListener('click', () => {
    if (state.stream) {
      stopCamera();
      state.source = 'photo'; // el último frame queda como imagen estática
      updateLabels();
    } else {
      startCamera();
    }
  });

  $('freezeBtn').addEventListener('click', () => {
    if (state.source !== 'camera') return;
    setFrozen(!state.frozen);
    if (state.frozen) {
      wave();
      toast('¡Colapsó!', pick(QUIPS_COLLAPSE));
    }
  });

  // ---------- Foto (alternativa) ----------
  $('photoBtn').addEventListener('click', () => $('fileInput').click());
  $('fileInput').addEventListener('change', e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      if (state.stream) stopCamera();
      state.source = 'photo';
      loadStatic(img, img.naturalWidth, img.naturalHeight);
      URL.revokeObjectURL(url);
      updateLabels();
      wave();
      toast('Qubit capturado', state.filter ? '' : 'Ahora elegí Rojo o Cian.');
    };
    img.onerror = () => { URL.revokeObjectURL(url); toast('Ups', 'No se pudo leer la imagen'); };
    img.src = url;
  });

  // ---------- Imagen demo ----------
  // Un dorso como los de tools/generar_dorsos.py, con una "impresión" simulada
  // (curva de tono, cruce de tintas, luz despareja y ruido de cámara).
  const DEMO_AMP = 12;
  const VIOLET = [109, 79, 163], ORANGE = [233, 162, 59];

  // Máscara 0..1 de una flecha; angle 0 = arriba, sentido horario.
  // Por defecto centrada y de tamaño completo (la real).
  function arrowMask(P, angle, scale = 1, cx = P / 2, cy = P / 2) {
    const c = document.createElement('canvas');
    c.width = c.height = P;
    const ctx = c.getContext('2d'), u = scale * P / CARD_MM;
    const L = 28 * u, t = 6 * u, hw = 16 * u, hl = 11 * u;
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(0, -L / 2); ctx.lineTo(hw / 2, -L / 2 + hl); ctx.lineTo(t / 2, -L / 2 + hl);
    ctx.lineTo(t / 2, L / 2); ctx.lineTo(-t / 2, L / 2); ctx.lineTo(-t / 2, -L / 2 + hl);
    ctx.lineTo(-hw / 2, -L / 2 + hl); ctx.closePath();
    ctx.fill();
    const a = ctx.getImageData(0, 0, P, P).data, m = new Float32Array(P * P);
    for (let p = 0; p < m.length; p++) m[p] = a[p * 4 + 3] / 255;
    return m;
  }

  // Ojo del logo: almendra crema con borde navy, iris celeste y flechita
  function drawMark(ctx, cx, cy, u) {
    const almond = (w, h) => {
      ctx.beginPath();
      ctx.moveTo(cx - w / 2, cy);
      ctx.quadraticCurveTo(cx, cy - h, cx + w / 2, cy);
      ctx.quadraticCurveTo(cx, cy + h, cx - w / 2, cy);
      ctx.closePath();
    };
    ctx.save();
    ctx.fillStyle = ctx.strokeStyle = '#141d3a';
    ctx.lineWidth = 0.9 * u; ctx.lineJoin = 'round';
    almond(9.5 * u, 5.6 * u); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#f3eee2';
    almond(9.5 * 0.82 * u, 5.6 * 0.72 * u); ctx.fill();
    ctx.fillStyle = '#7fb0e3'; ctx.beginPath(); ctx.arc(cx, cy, 1.75 * u, 0, Math.PI * 2); ctx.fill();
    const rp = 1.75 * 0.58 * u, a = rp * 0.8;
    ctx.fillStyle = '#141d3a'; ctx.beginPath(); ctx.arc(cx, cy, rp, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f3eee2';
    ctx.beginPath();
    ctx.moveTo(cx, cy - a); ctx.lineTo(cx + a * 0.7, cy); ctx.lineTo(cx + a * 0.28, cy);
    ctx.lineTo(cx + a * 0.28, cy + a); ctx.lineTo(cx - a * 0.28, cy + a);
    ctx.lineTo(cx - a * 0.28, cy); ctx.lineTo(cx - a * 0.7, cy); ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function makeDemo() {
    const W = 720, H = 540;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#3a3f52';
    ctx.fillRect(0, 0, W, H);

    const g = guideRect(W, H), P = g.s, n = P * P, u = P / CARD_MM;
    const tmp = new Float32Array(n);

    // Laberinto: ruido pasabanda umbralado
    const w = new Float32Array(n);
    for (let p = 0; p < n; p++) w[p] = Math.random() - 0.5;
    const fine = Float32Array.from(w), coarse = Float32Array.from(w);
    blur(fine, tmp, P, 0.35 * u);
    blur(coarse, tmp, P, 0.6 * u);
    let ss = 0;
    for (let p = 0; p < n; p++) { fine[p] -= coarse[p]; ss += fine[p] * fine[p]; }
    const k = 4 / Math.sqrt(ss / n);

    const up = Math.random() < 0.5, right = Math.random() < 0.5;
    const mv = arrowMask(P, up ? 0 : Math.PI), mh = arrowMask(P, right ? Math.PI / 2 : -Math.PI / 2);
    blur(mv, tmp, P, u);
    blur(mh, tmp, P, u);

    // Señuelos: flechas falsas que solo cambian el contraste del laberinto
    // (la app no las ve). Las primeras 3, grandes y centradas como las reales.
    const decoy = new Float32Array(n), force = DEMO_AMP * 0.79 / 77;
    const nDecoys = 6 + Math.floor(Math.random() * 5);
    for (let d = 0; d < nDecoys; d++) {
      const big = d < 3;
      const ang = big && Math.random() < 0.75 ? (Math.random() * 4 | 0) * Math.PI / 2 : Math.random() * 2 * Math.PI;
      const sc = big ? 0.85 + 0.15 * Math.random() : 0.45 + 0.45 * Math.random();
      const lo = 8 * u, span = P - 16 * u;
      const cx = big ? P / 2 : lo + Math.random() * span, cy = big ? P / 2 : lo + Math.random() * span;
      const m = arrowMask(P, ang, sc, cx, cy), w = (Math.random() < 0.5 ? -1 : 1) * (0.7 + 0.6 * Math.random()) * force;
      for (let p = 0; p < n; p++) decoy[p] += w * m[p];
    }
    blur(decoy, tmp, P, u);

    const img = ctx.createImageData(P, P), o = img.data;
    for (let p = 0, i = 0; p < n; p++, i += 4) {
      const t = 0.5 + 0.5 * Math.tanh(k * fine[p]), car = 2 * t - 1;
      const sv = 2 * mv[p] - 1, sh = 2 * mh[p] - 1, tk = 0.5 + (t - 0.5) * (1 + decoy[p]);
      let r = VIOLET[0] + (ORANGE[0] - VIOLET[0]) * tk + DEMO_AMP / 2 * car * sv;
      let gg = VIOLET[1] + (ORANGE[1] - VIOLET[1]) * tk + DEMO_AMP / 2 * car * sh;
      let bb = VIOLET[2] + (ORANGE[2] - VIOLET[2]) * tk + DEMO_AMP / 2 * car * sh;
      // Impresión simulada
      r = 255 * Math.pow(r / 255, 1.1) + 0.1 * (gg - bb);
      gg = 255 * Math.pow(gg / 255, 1.15) - 0.05 * r;
      const luz = 0.75 + 0.4 * (p % P) / P;
      o[i] = r * luz + (Math.random() - 0.5) * 8;
      o[i + 1] = gg * luz + (Math.random() - 0.5) * 8;
      o[i + 2] = bb * luz + (Math.random() - 0.5) * 8;
      o[i + 3] = 255;
    }
    ctx.putImageData(img, g.x, g.y);
    drawMark(ctx, g.x + MARK_MM * u, g.y + MARK_MM * u, u);
    return c;
  }

  // ---------- Inicio ----------
  const demo = makeDemo();
  loadStatic(demo, demo.width, demo.height);
  updateLabels();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
