<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#141d3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="¡Colapsá!">
<title>Mirá Vos · ¡Colapsá!</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23141d3a'/%3E%3Cpath d='M6 32Q32 6 58 32Q32 58 6 32Z' fill='none' stroke='%23f3eee2' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='11' fill='%237fb0e3'/%3E%3Ccircle cx='32' cy='32' r='6.5' fill='%23141d3a'/%3E%3Cpath d='M32 27l-4 4.5h2.6V37h2.8v-5.5H36z' fill='%23f3eee2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #141d3a;
    --navy-2: #1b2648;
    --navy-3: #0f1630;
    --line: #2c3961;
    --cream: #f3eee2;
    --muted: #9aa6c7;
    --sky: #7fb0e3;
    --orange: #e9a23b;
    --violet: #6d4fa3;
    --red: #e0473c;
    --cyan: #2fd3dc;
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --serif: "Fraunces", Georgia, serif;
    --sans: "Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--navy); color: var(--cream);
    font: 15px/1.3 var(--sans);
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
  }
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  /* ---------- Escenario ---------- */
  #stage {
    position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden;
    background:
      repeating-radial-gradient(circle at 50% 55%, transparent 0 46px, #ffffff0d 46px 47px),
      var(--navy);
  }
  #view {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; display: block;
  }

  header {
    position: absolute; top: 0; left: 0; right: 0;
    padding: calc(var(--sat) + 10px) calc(var(--sar) + 14px) 18px calc(var(--sal) + 14px);
    display: flex; align-items: center; gap: 10px;
    background: linear-gradient(#141d3af2, #141d3a00);
    pointer-events: none;
  }
  header svg { width: 44px; height: 28px; flex: none; }
  .brand { display: flex; flex-direction: column; line-height: 1; }
  .brand b { font: 900 22px/1 var(--serif); letter-spacing: -.01em; }
  .brand small {
    margin-top: 4px; font-size: 10px; font-weight: 500; letter-spacing: .32em;
    color: var(--sky); text-transform: uppercase;
  }
  header .spacer { flex: 1; }
  #status {
    font-size: 12px; padding: 4px 10px; border-radius: 999px;
    border: 1px solid #7fb0e366; color: var(--sky); white-space: nowrap;
  }
  #status.live::before {
    content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--orange); margin-right: 6px; vertical-align: 1px;
    animation: blink 1.4s infinite;
  }
  #status.collapsed { background: var(--orange); border-color: var(--orange); color: var(--navy); font-weight: 700; }
  @keyframes blink { 50% { opacity: .25; } }

  #caption {
    position: absolute; left: 0; right: 0; bottom: 14px; text-align: center;
    font-size: 13px; color: var(--cream); pointer-events: none; padding: 0 16px;
    text-shadow: 0 1px 6px #000c;
  }
  #caption em { color: var(--orange); font-style: normal; font-weight: 700; }

  /* Onda de "colapso" al cambiar de filtro */
  #wave {
    position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px;
    border-radius: 50%; border: 3px solid var(--cream); opacity: 0; pointer-events: none;
  }
  #wave.go { animation: wave .55s ease-out; }
  @keyframes wave {
    0% { transform: scale(.4); opacity: .9; }
    100% { transform: scale(14); opacity: 0; }
  }

  #toast {
    position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%) scale(.95);
    background: var(--cream); color: var(--navy); border-radius: 14px;
    padding: 12px 18px; font-size: 15px; font-weight: 500; text-align: center;
    box-shadow: 0 8px 30px #0008;
    opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; max-width: 85%;
  }
  #toast b { font-family: var(--serif); font-weight: 900; display: block; font-size: 18px; margin-bottom: 2px; }
  #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  /* ---------- Panel ---------- */
  #panel {
    flex: 0 0 auto; background: var(--navy-3); border-top: 1px solid var(--line);
    padding: 12px calc(var(--sar) + 12px) calc(var(--sab) + 12px) calc(var(--sal) + 12px);
    display: flex; flex-direction: column; gap: 10px;
  }
  #filters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .filter {
    min-height: 78px; border-radius: 16px; border: 2px solid var(--line);
    background: var(--navy-2); color: var(--cream); font: inherit; text-align: left;
    display: flex; align-items: center; gap: 12px; padding: 10px 14px;
    transition: background .15s, border-color .15s;
  }
  .gate {
    flex: none; width: 38px; height: 38px; border-radius: 50%;
    display: grid; place-items: center; font: 900 17px/1 var(--serif); color: #fff;
  }
  .filter[data-f="z"] .gate { background: var(--red); }
  .filter[data-f="x"] .gate { background: var(--cyan); color: var(--navy); }
  .filter .txt { display: flex; flex-direction: column; gap: 3px; }
  .filter .txt b { font: 900 21px/1 var(--serif); }
  .filter .txt small { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
  .filter[data-f="z"].active { border-color: var(--red); background: #3b1d2c; }
  .filter[data-f="x"].active { border-color: var(--cyan); background: #123947; }
  .filter.active .txt small { color: var(--cream); }

  #actions { display: grid; grid-template-columns: 1.35fr 1fr 1fr; gap: 8px; }
  .btn {
    min-height: 48px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--navy-2); color: var(--cream); font: 700 14px var(--sans); padding: 0 6px;
  }
  .btn.primary { background: var(--cream); color: var(--navy); border-color: var(--cream); }
  .btn.on { background: var(--orange); color: var(--navy); border-color: var(--orange); }
  .btn:disabled { opacity: .35; }
  .btn:active, .filter:active, .chip:active { transform: scale(.97); }

  #tools { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .chip {
    min-height: 34px; border-radius: 999px; border: 1px solid var(--line);
    background: transparent; color: var(--muted); font: 500 12px var(--sans); letter-spacing: .04em;
  }
  .chip.on { border-color: var(--sky); color: var(--cream); background: #7fb0e322; }
  #fileInput { display: none; }

  @media (min-width: 700px) {
    #panel { max-width: 560px; width: 100%; margin: 0 auto; border-radius: 18px 18px 0 0; border: 1px solid var(--line); }
  }
  @media (orientation: landscape) and (max-height: 500px) {
    body { flex-direction: row; }
    #panel { width: 270px; border-top: 0; border-left: 1px solid var(--line); justify-content: center;
             padding-top: calc(var(--sat) + 12px); }
    #filters { grid-template-columns: 1fr; }
    .filter { min-height: 62px; }
    #actions { grid-template-columns: 1fr 1fr; }
    #camBtn { grid-column: span 2; }
  }
</style>
</head>
<body>

<div id="stage">
  <canvas id="view"></canvas>
  <div id="wave"></div>
  <header>
    <svg viewBox="0 0 66 42" aria-hidden="true">
      <path d="M3 21Q33 -5 63 21Q33 47 3 21Z" fill="none" stroke="#f3eee2" stroke-width="3.5" stroke-linejoin="round"/>
      <circle cx="33" cy="21" r="11" fill="#7fb0e3"/>
      <circle cx="33" cy="21" r="6.5" fill="#141d3a"/>
      <path d="M33 16.3l-4 4.4h2.6v5h2.8v-5H37z" fill="#f3eee2"/>
    </svg>
    <div class="brand"><b>Mirá Vos</b><small>¡Colapsá!</small></div>
    <span class="spacer"></span>
    <span id="status">demo</span>
  </header>
  <div id="caption"></div>
  <div id="toast"></div>
</div>

<div id="panel">
  <div id="filters">
    <button class="filter" data-f="z">
      <span class="gate">Z</span>
      <span class="txt"><b>Eje Z</b><small>↑ sí · ↓ no</small></span>
    </button>
    <button class="filter" data-f="x">
      <span class="gate">X</span>
      <span class="txt"><b>Eje X</b><small>→ sí · ← no</small></span>
    </button>
  </div>
  <div id="actions">
    <button class="btn primary" id="camBtn">Encender detector</button>
    <button class="btn" id="freezeBtn" disabled>Colapsar</button>
    <button class="btn" id="photoBtn">Sacar foto</button>
  </div>
  <div id="tools">
    <button class="chip" data-opt="debug">Debug</button>
  </div>
  <input type="file" id="fileInput" accept="image/*" capture="environment">
</div>

<video id="video" playsinline muted autoplay style="display:none"></video>

<script>
(() => {
  'use strict';

  const MAX_SIDE = 720;
  const GUIDE = 0.72;       // lado del recuadro guía, fracción del lado menor del cuadro
  const CARD_MM = 40;       // el recuadro guía es la carta cortada

  // Código espectral: igual que tools/codigo_espectral.py. Cada respuesta es
  // un acorde de K ondas (ciclos/mm, en el marco de la carta) sumado al dorso
  // en el eje azul−amarillo. Se lee por la energía en esas frecuencias, así
  // que no importa dónde ni cómo esté girada la carta.
  const P = 256;            // lado al que se lleva la carta para leer
  const BIN = CARD_MM;      // bins de FFT por ciclo/mm
  const BAND = [0.5, 0.8];
  const K = 3;
  const CODES = {
    z_si: [[0.5613, 0.0990], [0.2847, 0.7047], [-0.7210, 0.1665]],
    z_no: [[0.1030, 0.7328], [0.6390, 0.2326], [0.7238, 0.1539]],
    x_si: [[-0.2134, 0.6981], [-0.5501, 0.3997], [-0.6954, 0.2531]],
    x_no: [[-0.3009, 0.7088], [0.7034, 0.3132], [-0.5843, 0.0821]],
  };
  // z = diferencia SÍ−NO en unidades de ruido. En simulación: con código z ≥ 11
  // aun a 3 niveles; sin código z ≤ 4. Revisar con la hoja de prueba impresa.
  const Z_SURE = 8, Z_MAYBE = 5;
  const ROTS = [], SCALES = [];
  for (let a = 0; a < 180; a += 1.5) ROTS.push(a * Math.PI / 180);
  for (let s = 0.88; s < 1.121; s += 0.03) SCALES.push(s);

  const QUIPS_COLLAPSE = [
    'Medido. Ahora la respuesta no se mueve.',
    'El estado quedó definido.',
    'Lo que medís, queda.',
    'Ni el gato de Schrödinger se movió.',
  ];
  const QUIPS_FILTER = {
    z: ['Medir en eje Z', '↑ es SÍ, ↓ es NO.'],
    x: ['Medir en eje X', '→ es SÍ, ← es NO.'],
  };
  // Como en el frente: en Z las flechas son verticales, en X horizontales.
  // SÍ es el sentido positivo de los ejes de un gráfico (autovalor +1).
  const ARROWS = { z: { si: '↑', no: '↓' }, x: { si: '→', no: '←' } };
  const ANGLES = { z: { si: 0, no: Math.PI }, x: { si: Math.PI / 2, no: -Math.PI / 2 } };

  const $ = id => document.getElementById(id);
  const view = $('view');
  const vctx = view.getContext('2d');
  const work = document.createElement('canvas');
  const wctx = work.getContext('2d', { willReadFrequently: true });
  const proc = document.createElement('canvas');
  proc.width = proc.height = P;
  const pctx = proc.getContext('2d', { willReadFrequently: true });
  const video = $('video');

  const state = {
    filter: null,       // null | 'z' | 'x' (eje en el que se mide)
    source: 'demo',     // 'demo' | 'camera' | 'photo'
    frozen: false,
    stream: null,
    debug: false,       // carta · canal azul−amarillo · espectro
  };

  let raw = null;       // ImageData del frame original

  const pick = arr => arr[(Math.random() * arr.length) | 0];

  let toastTimer;
  function toast(title, msg = '', ms = 1800) {
    const t = $('toast');
    t.innerHTML = '';
    const b = document.createElement('b');
    b.textContent = title;
    t.append(b, msg);
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), ms);
  }

  function wave() {
    const w = $('wave');
    w.classList.remove('go');
    void w.offsetWidth;
    w.classList.add('go');
  }

  function updateLabels() {
    const s = $('status');
    s.className = '';
    if (state.source === 'camera') {
      s.textContent = state.frozen ? 'colapsado' : 'en vivo';
      s.classList.add(state.frozen ? 'collapsed' : 'live');
    } else {
      s.textContent = state.source === 'demo' ? 'demo' : 'foto';
    }

    const c = $('caption');
    if (state.source === 'demo' && !state.filter) {
      c.innerHTML = 'Este dorso esconde dos respuestas. <em>Medí en eje Z o en eje X</em>.';
    } else if (state.source === 'camera' && !state.filter) {
      c.innerHTML = 'Encuadrá el dorso de una carta en el recuadro y <em>elegí un eje</em>.';
    } else if (!state.filter) {
      c.textContent = '';
    }
  }

  function setSize(w, h) {
    const k = Math.min(1, MAX_SIDE / Math.max(w, h));
    const W = Math.max(1, Math.round(w * k)), H = Math.max(1, Math.round(h * k));
    if (work.width !== W || work.height !== H) {
      work.width = W; work.height = H;
    }
  }

  function guideRect(W, H) {
    const s = Math.round(Math.min(W, H) * GUIDE);
    return { x: (W - s) >> 1, y: (H - s) >> 1, s };
  }

  // ---------- Utilidades numéricas ----------
  // Promedio móvil en una dirección, replicando el borde
  function boxPass(src, dst, n, r, horiz) {
    const step = horiz ? 1 : n, lstep = horiz ? n : 1, inv = 1 / (2 * r + 1), last = n - 1;
    for (let l = 0; l < n; l++) {
      const base = l * lstep;
      let acc = src[base] * (r + 1);
      for (let i = 1; i <= r; i++) acc += src[base + Math.min(i, last) * step];
      for (let i = 0; i < n; i++) {
        dst[base + i * step] = acc * inv;
        acc += src[base + Math.min(i + r + 1, last) * step] - src[base + Math.max(i - r, 0) * step];
      }
    }
  }

  // Tres pasadas de caja ≈ gaussiana de desvío sigma, sobre un cuadrado n × n
  function blur(a, tmp, n, sigma) {
    const r = Math.max(1, Math.round((Math.sqrt(4 * sigma * sigma + 1) - 1) / 2));
    for (let k = 0; k < 3; k++) {
      boxPass(a, tmp, n, r, true);
      boxPass(tmp, a, n, r, false);
    }
  }

  // FFT radix 2 de largo P, en el lugar
  const REV = new Uint16Array(P), COS = new Float64Array(P / 2), SIN = new Float64Array(P / 2);
  for (let i = 0, bits = Math.log2(P); i < P; i++) {
    let r = 0;
    for (let b = 0; b < bits; b++) r |= ((i >> b) & 1) << (bits - 1 - b);
    REV[i] = r;
  }
  for (let k = 0; k < P / 2; k++) { COS[k] = Math.cos(2 * Math.PI * k / P); SIN[k] = Math.sin(2 * Math.PI * k / P); }

  function fft(re, im) {
    for (let i = 0; i < P; i++) {
      const j = REV[i];
      if (j > i) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; }
    }
    for (let size = 2; size <= P; size *= 2) {
      const half = size / 2, step = P / size;
      for (let i = 0; i < P; i += size) {
        for (let j = 0; j < half; j++) {
          const a = i + j, b = a + half, c = COS[j * step], s = SIN[j * step];
          const tr = re[b] * c + im[b] * s, ti = im[b] * c - re[b] * s;
          re[b] = re[a] - tr; im[b] = im[a] - ti;
          re[a] += tr; im[a] += ti;
        }
      }
    }
  }

  // Espectro de potencia 2D de a (P × P real)
  const rowRe = new Float64Array(P), rowIm = new Float64Array(P);
  function power2d(a, outRe, outIm, E) {
    for (let y = 0; y < P; y++) {
      for (let x = 0; x < P; x++) { rowRe[x] = a[y * P + x]; rowIm[x] = 0; }
      fft(rowRe, rowIm);
      for (let x = 0; x < P; x++) { outRe[y * P + x] = rowRe[x]; outIm[y * P + x] = rowIm[x]; }
    }
    for (let x = 0; x < P; x++) {
      for (let y = 0; y < P; y++) { rowRe[y] = outRe[y * P + x]; rowIm[y] = outIm[y * P + x]; }
      fft(rowRe, rowIm);
      for (let y = 0; y < P; y++) E[y * P + x] = rowRe[y] * rowRe[y] + rowIm[y] * rowIm[y];
    }
  }

  // ---------- Lectura de la carta ----------
  const n2 = P * P, f32 = () => new Float32Array(n2);
  const B = { C: f32(), Y: f32(), L: f32(), M: f32(), W: f32(), tmp: f32(), re: new Float64Array(n2),
              im: new Float64Array(n2), E: new Float64Array(n2), Emax: new Float64Array(n2) };
  const HANN = Float32Array.from({ length: P }, (_, i) => 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (P - 1)));
  const RING = [];
  for (let y = 0; y < P; y++) {
    for (let x = 0; x < P; x++) {
      const fx = (x < P / 2 ? x : x - P) / BIN, fy = (y < P / 2 ? y : y - P) / BIN, r = Math.hypot(fx, fy);
      if (r > BAND[0] && r < BAND[1]) RING.push(y * P + x);
    }
  }

  // Canal azul−amarillo sin fondo, sin los trazos del dibujo y con ventana.
  // Los trazos se detectan por luminancia: el código está compensado para no
  // cambiarla, así que el umbral puede ser bajo. El fondo se estima solo con
  // lo que queda, para que los trazos no dejen halo. Resultado en B.C.
  function prepare(px) {
    const { C, Y, L, M, W, tmp } = B, mm = P / CARD_MM;
    for (let p = 0, i = 0; p < n2; p++, i += 4) {
      C[p] = px[i + 2] - (px[i] + px[i + 1]) / 2;
      Y[p] = 0.2126 * px[i] + 0.7152 * px[i + 1] + 0.0722 * px[i + 2];
    }
    L.set(Y); blur(L, tmp, P, 0.5 * mm);
    for (let p = 0; p < n2; p++) M[p] = Math.abs(Y[p] - L[p]) > 6 ? 1 : 0;
    blur(M, tmp, P, 0.3 * mm);
    for (let p = 0; p < n2; p++) { M[p] = M[p] < 0.05 ? 1 : 0; L[p] = C[p] * M[p]; W[p] = M[p]; }
    blur(L, tmp, P, mm);
    blur(W, tmp, P, mm);
    for (let y = 0; y < P; y++) {
      for (let x = 0; x < P; x++) {
        const p = y * P + x;
        C[p] = M[p] ? (C[p] - L[p] / Math.max(W[p], 1e-3)) * HANN[x] * HANN[y] : 0;
      }
    }
  }

  let smooth = null;     // promedio de los últimos cuadros en vivo

  // Lee la carta del recuadro guía: energía de cada acorde en el giro y la
  // escala que mejor encajan.
  function readCard(g) {
    pctx.drawImage(work, g.x, g.y, g.s, g.s, 0, 0, P, P);
    const px = pctx.getImageData(0, 0, P, P).data;
    prepare(px);
    const { C, re, im, E, Emax } = B;
    power2d(C, re, im, E);

    let mu = 0;
    for (const p of RING) mu += E[p];
    mu = mu / RING.length || 1;
    // Máximo en la vecindad 3 × 3: tolera medio bin de error en giro o escala
    for (let y = 0; y < P; y++) {
      for (let x = 0; x < P; x++) {
        let m = 0;
        for (let dy = -1; dy <= 1; dy++) {
          const yy = ((y + dy) & (P - 1)) * P;
          for (let dx = -1; dx <= 1; dx++) m = Math.max(m, E[yy + ((x + dx) & (P - 1))]);
        }
        Emax[y * P + x] = m / mu;
      }
    }

    const names = Object.keys(CODES);
    let best = null;
    for (const th of ROTS) {
      const c = Math.cos(th), s = Math.sin(th);
      for (const sc of SCALES) {
        const e = {};
        for (const k of names) {
          let sum = 0;
          for (const [fx, fy] of CODES[k]) {
            const gx = Math.round(sc * BIN * (c * fx - s * fy)), gy = Math.round(sc * BIN * (s * fx + c * fy));
            sum += Emax[(gy & (P - 1)) * P + (gx & (P - 1))];
          }
          e[k] = sum;
        }
        const total = Math.max(e.z_si, e.z_no) + Math.max(e.x_si, e.x_no);
        if (!best || total > best.total) best = { total, e, th, sc };
      }
    }

    // En vivo, se promedian los últimos cuadros para que no titile
    let e = best.e;
    if (state.source === 'camera' && !state.frozen) {
      if (smooth) for (const k of names) e[k] = smooth[k] = 0.6 * smooth[k] + 0.4 * e[k];
      else smooth = { ...e };
    } else {
      smooth = null;
    }

    const z = f => (e[f + '_si'] - e[f + '_no']) / Math.sqrt(2 * K);
    return { z: z('z'), x: z('x'), th: best.th, sc: best.sc };
  }

  function verdict(res) {
    const z = res[state.filter];
    const level = Math.abs(z) >= Z_SURE ? 'sure' : Math.abs(z) >= Z_MAYBE ? 'maybe' : 'none';
    return { answer: z > 0 ? 'si' : 'no', z: Math.abs(z), level };
  }

  function verdictText(v) {
    if (v.level === 'none') return 'No se lee. Encuadrá el dorso y buscá más luz.';
    const word = v.answer === 'si' ? 'SÍ' : 'NO', arrow = ARROWS[state.filter][v.answer];
    const value = v.answer === 'si' ? '+1' : '−1', eje = state.filter.toUpperCase();
    return v.level === 'sure' ? `Eje ${eje}: ${arrow} · decí ${word} (${value})`
                              : `Eje ${eje}: ${arrow}? · dudosa, probá de nuevo`;
  }

  // ---------- Dibujo ----------
  function drawGuide(g) {
    vctx.save();
    vctx.strokeStyle = '#f3eee2';
    vctx.lineWidth = 2;
    vctx.setLineDash([10, 7]);
    vctx.strokeRect(g.x + 0.5, g.y + 0.5, g.s - 1, g.s - 1);
    vctx.restore();
  }

  // La flecha medida en grande, y debajo lo que hay que decir: SÍ (verde) o
  // NO (rojo), con su valor (+1 o −1)
  function drawVerdict(g, v) {
    const cx = g.x + g.s / 2, cy = g.y + g.s / 2, u = g.s / 100;
    vctx.save();
    vctx.fillStyle = 'rgba(15, 22, 48, .8)';
    vctx.beginPath();
    vctx.roundRect(cx - 36 * u, cy - 38 * u, 72 * u, 76 * u, 8 * u);
    vctx.fill();
    vctx.textAlign = 'center';
    vctx.textBaseline = 'middle';
    if (v.level === 'none') {
      vctx.fillStyle = '#9aa6c7';
      vctx.font = `700 ${9 * u}px "Space Grotesk", system-ui, sans-serif`;
      vctx.fillText('no se lee', cx, cy);
    } else {
      const si = v.answer === 'si';
      vctx.globalAlpha = v.level === 'sure' ? 1 : 0.5;
      drawArrow(cx, cy - 14 * u, 34 * u, ANGLES[state.filter][v.answer]);
      vctx.fillStyle = si ? '#4cc38a' : '#e0473c';
      vctx.font = `900 ${20 * u}px Fraunces, Georgia, serif`;
      vctx.fillText(si ? 'SÍ' : 'NO', cx, cy + 17 * u);
      vctx.fillStyle = '#f3eee2';
      vctx.font = `700 ${7 * u}px "Space Grotesk", system-ui, sans-serif`;
      vctx.fillText(v.level === 'sure' ? (si ? '+1' : '−1') : 'dudosa', cx, cy + 31 * u);
    }
    vctx.restore();
  }

  // Flecha crema con borde navy; angle 0 = arriba, sentido horario
  function drawArrow(cx, cy, len, angle) {
    const t = len * 0.22, hw = len * 0.58, hl = len * 0.4;
    vctx.save();
    vctx.translate(cx, cy);
    vctx.rotate(angle);
    vctx.beginPath();
    vctx.moveTo(0, -len / 2); vctx.lineTo(hw / 2, -len / 2 + hl); vctx.lineTo(t / 2, -len / 2 + hl);
    vctx.lineTo(t / 2, len / 2); vctx.lineTo(-t / 2, len / 2); vctx.lineTo(-t / 2, -len / 2 + hl);
    vctx.lineTo(-hw / 2, -len / 2 + hl); vctx.closePath();
    vctx.fillStyle = '#f3eee2';
    vctx.strokeStyle = '#141d3a';
    vctx.lineWidth = len * 0.05;
    vctx.lineJoin = 'round';
    vctx.fill();
    vctx.stroke();
    vctx.restore();
  }

  // Debug: espectro centrado en escala logarítmica, con los acordes marcados
  // en el giro y la escala encontrados (verde = SÍ, rojo = NO del eje activo)
  function paintSpectrum(res) {
    const img = pctx.createImageData(P, P), o = img.data, E = B.Emax;
    for (let y = 0; y < P; y++) {
      for (let x = 0; x < P; x++) {
        const v = Math.min(255, Math.max(0, 40 * Math.log10(1 + E[((y + P / 2) & (P - 1)) * P + ((x + P / 2) & (P - 1))]) * 2));
        const i = (y * P + x) * 4;
        o[i] = o[i + 1] = o[i + 2] = v; o[i + 3] = 255;
      }
    }
    pctx.putImageData(img, 0, 0);
    const f = state.filter, c = Math.cos(res.th), s = Math.sin(res.th);
    for (const k of Object.keys(CODES)) {
      pctx.strokeStyle = k === `${f}_si` ? '#4cc38a' : k === `${f}_no` ? '#e0473c' : '#5b6790';
      pctx.lineWidth = 1.5;
      for (const [fx, fy] of CODES[k]) {
        for (const sg of [1, -1]) {
          const gx = sg * res.sc * BIN * (c * fx - s * fy), gy = sg * res.sc * BIN * (s * fx + c * fy);
          pctx.beginPath();
          pctx.arc(P / 2 + gx, P / 2 + gy, 4, 0, Math.PI * 2);
          pctx.stroke();
        }
      }
    }
  }

  function paintChannel() {
    const img = pctx.createImageData(P, P), o = img.data, C = B.C;
    let m = 0;
    for (let p = 0; p < n2; p++) m = Math.max(m, Math.abs(C[p]));
    const k = 127 / Math.max(1, m * 0.5);
    for (let p = 0, i = 0; p < n2; p++, i += 4) {
      const v = Math.max(0, Math.min(255, 128 + C[p] * k));
      o[i] = o[i + 1] = v; o[i + 2] = 255 - v * 0.4; o[i + 3] = 255;
    }
    pctx.putImageData(img, 0, 0);
  }

  function loadStatic(img, w, h) {
    setSize(w, h);
    wctx.drawImage(img, 0, 0, work.width, work.height);
    raw = wctx.getImageData(0, 0, work.width, work.height);
    render();
  }

  function render() {
    if (!raw) return;
    const W = work.width, H = work.height, g = guideRect(W, H);

    if (state.filter && state.debug) {
      // Tres paneles: en fila si la pantalla es ancha, en columna si es alta
      const stage = $('stage'), wide = stage.clientWidth >= stage.clientHeight;
      const gap = 8, lab = 22;
      const VW = wide ? 3 * P + 2 * gap : P, VH = wide ? P + lab : 3 * (P + lab) + 2 * gap;
      if (view.width !== VW || view.height !== VH) { view.width = VW; view.height = VH; }
      vctx.fillStyle = '#0f1630';
      vctx.fillRect(0, 0, VW, VH);
      vctx.font = '500 13px "Space Grotesk", system-ui, sans-serif';
      const res = readCard(g);
      const panels = [['carta', () => pctx.drawImage(work, g.x, g.y, g.s, g.s, 0, 0, P, P)],
                      ['canal azul−amarillo', paintChannel], ['espectro', () => paintSpectrum(res)]];
      panels.forEach(([name, paint], k) => {
        const x = wide ? k * (P + gap) : 0, y = wide ? 0 : k * (P + lab + gap);
        paint();
        vctx.drawImage(proc, x, y + lab);
        vctx.fillStyle = '#9aa6c7';
        vctx.fillText(name, x + 2, y + 15);
      });
      const fmt = z => `${z > 0 ? 'SÍ' : 'NO'} z ${Math.abs(z).toFixed(1)}`;
      $('caption').textContent = `eje Z ${fmt(res.z)} · eje X ${fmt(res.x)} · giro ${(res.th * 180 / Math.PI).toFixed(0)}° · escala ${res.sc.toFixed(2)}`;
      return;
    }

    if (view.width !== W || view.height !== H) { view.width = W; view.height = H; }
    vctx.putImageData(raw, 0, 0);
    drawGuide(g);
    if (state.filter) {
      const v = verdict(readCard(g));
      vctx.fillStyle = state.filter === 'z' ? 'rgba(224, 71, 60, .16)' : 'rgba(47, 211, 220, .16)';
      vctx.fillRect(g.x, g.y, g.s, g.s);
      drawVerdict(g, v);
      $('caption').textContent = verdictText(v);
    }
  }

  function loop() {
    if (state.source === 'camera' && !state.frozen && video.readyState >= 2 && video.videoWidth) {
      setSize(video.videoWidth, video.videoHeight);
      wctx.drawImage(video, 0, 0, work.width, work.height);
      raw = wctx.getImageData(0, 0, work.width, work.height);
      render();
    }
    requestAnimationFrame(loop);
  }

  // ---------- Filtros ----------
  document.querySelectorAll('.filter').forEach(btn => {
    btn.addEventListener('click', () => {
      // Tocar el filtro activo lo apaga
      state.filter = state.filter === btn.dataset.f ? null : btn.dataset.f;
      document.querySelectorAll('.filter').forEach(b => b.classList.toggle('active', b.dataset.f === state.filter));
      smooth = null;
      if (state.filter) {
        wave();
        const [title, msg] = QUIPS_FILTER[state.filter];
        toast(title, msg, 1200);
      }
      updateLabels();
      render();
    });
  });

  document.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      const k = btn.dataset.opt;
      state[k] = !state[k];
      btn.classList.toggle('on', state[k]);
      updateLabels();
      render();
    });
  });

  // ---------- Cámara ----------
  async function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      toast('Sin detector', 'La cámara no está disponible. Usá "Sacar foto".', 3500);
      return;
    }
    $('camBtn').disabled = true;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
      });
      state.stream = stream;
      video.srcObject = stream;
      await video.play();
      state.source = 'camera';
      setFrozen(false);
      $('camBtn').textContent = 'Apagar detector';
      $('camBtn').classList.remove('primary');
      $('freezeBtn').disabled = false;
    } catch (err) {
      console.error(err);
      toast('Detector bloqueado', err && err.name === 'NotAllowedError'
        ? 'Sin permiso de cámara. Podés usar "Sacar foto".'
        : 'No se pudo abrir la cámara. Probá con "Sacar foto".', 3500);
    } finally {
      $('camBtn').disabled = false;
      updateLabels();
    }
  }

  function stopCamera() {
    if (state.stream) state.stream.getTracks().forEach(t => t.stop());
    state.stream = null;
    video.srcObject = null;
    $('camBtn').textContent = 'Encender detector';
    $('camBtn').classList.add('primary');
    $('freezeBtn').disabled = true;
    setFrozen(false);
  }

  function setFrozen(f) {
    state.frozen = f;
    const b = $('freezeBtn');
    b.textContent = f ? 'Seguir' : 'Colapsar';
    b.classList.toggle('on', f);
    updateLabels();
  }

  $('camBtn').addEventListener('click', () => {
    if (state.stream) {
      stopCamera();
      state.source = 'photo'; // el último frame queda como imagen estática
      updateLabels();
    } else {
      startCamera();
    }
  });

  $('freezeBtn').addEventListener('click', () => {
    if (state.source !== 'camera') return;
    setFrozen(!state.frozen);
    if (state.frozen) {
      wave();
      toast('¡Colapsó!', pick(QUIPS_COLLAPSE));
    }
  });

  // ---------- Foto (alternativa) ----------
  $('photoBtn').addEventListener('click', () => $('fileInput').click());
  $('fileInput').addEventListener('change', e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      if (state.stream) stopCamera();
      state.source = 'photo';
      loadStatic(img, img.naturalWidth, img.naturalHeight);
      URL.revokeObjectURL(url);
      updateLabels();
      wave();
      toast('Qubit capturado', state.filter ? '' : 'Ahora medí en eje Z o en eje X.');
    };
    img.onerror = () => { URL.revokeObjectURL(url); toast('Ups', 'No se pudo leer la imagen'); };
    img.src = url;
  });

  // ---------- Imagen demo ----------
  // El dorso de las cartas (la flor de órbitas) con el código a la misma
  // amplitud que las impresas, girado al azar y con luz despareja y ruido.
  const DEMO_AMP = 4;
  const LUM_COMP = 0.0722 / (0.2126 + 0.7152);

  // Medidas en mm desde el centro, tomadas de tools/dorso_base.png
  function drawFlower(ctx, cx, cy, u) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillStyle = '#13203c';
    ctx.fillRect(-22 * u, -22 * u, 44 * u, 44 * u);
    ctx.strokeStyle = '#48709a'; ctx.lineWidth = 0.35 * u;
    ctx.beginPath(); ctx.arc(0, 0, 18.8 * u, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = '#74acdf'; ctx.lineWidth = 0.5 * u;
    for (let k = 0; k < 8; k++) {
      const a = k * Math.PI / 4;
      ctx.beginPath();
      ctx.ellipse(11 * u * Math.cos(a), 11 * u * Math.sin(a), 6 * u, 3.9 * u, a, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.fillStyle = ctx.strokeStyle = '#f0b03c';
    for (let k = 0; k < 24; k++) {
      const a = k * Math.PI / 12;
      ctx.beginPath(); ctx.arc(17.6 * u * Math.cos(a), 17.6 * u * Math.sin(a), 0.65 * u, 0, Math.PI * 2); ctx.fill();
    }
    ctx.lineWidth = 0.25 * u;
    for (let k = 0; k < 16; k++) {
      const a = k * Math.PI / 8;
      ctx.beginPath();
      ctx.moveTo(2.75 * u * Math.cos(a), 2.75 * u * Math.sin(a));
      ctx.lineTo(5 * u * Math.cos(a), 5 * u * Math.sin(a));
      ctx.stroke();
    }
    ctx.lineWidth = 0.45 * u;
    ctx.beginPath(); ctx.arc(0, 0, 5.2 * u, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 2.75 * u, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function makeDemo() {
    const W = 720, H = 540, g = guideRect(W, H), u = g.s / CARD_MM;

    // La carta con sangrado, con el código sumado como en el generador
    const N = Math.round(44 * u), card = document.createElement('canvas');
    card.width = card.height = N;
    const cctx = card.getContext('2d', { willReadFrequently: true });
    drawFlower(cctx, N / 2, N / 2, u);
    const img = cctx.getImageData(0, 0, N, N), o = img.data;
    const answers = { z: Math.random() < 0.5 ? 'si' : 'no', x: Math.random() < 0.5 ? 'si' : 'no' };
    const waves = [...CODES[`z_${answers.z}`], ...CODES[`x_${answers.x}`]]
      .map(([fx, fy]) => [fx, fy, Math.random() * 2 * Math.PI]);
    const code = new Float32Array(N * N);
    let ss = 0;
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        const X = (x - N / 2) / u, Y = (y - N / 2) / u;
        let v = 0;
        for (const [fx, fy, ph] of waves) v += Math.cos(2 * Math.PI * (fx * X + fy * Y) + ph);
        code[y * N + x] = v; ss += v * v;
      }
    }
    const k = DEMO_AMP / Math.sqrt(ss / (N * N));
    for (let p = 0, i = 0; p < N * N; p++, i += 4) {
      const c = code[p] * k;
      o[i] -= LUM_COMP * c; o[i + 1] -= LUM_COMP * c; o[i + 2] += c;
    }
    cctx.putImageData(img, 0, 0);

    // Sobre la mesa, girada al azar
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.fillStyle = '#3a3f52';
    ctx.fillRect(0, 0, W, H);
    ctx.translate(W / 2, H / 2);
    ctx.rotate(Math.random() * 2 * Math.PI);
    ctx.drawImage(card, -N / 2, -N / 2);
    ctx.setTransform(1, 0, 0, 1, 0, 0);

    // Luz despareja y ruido de cámara
    const frame = ctx.getImageData(0, 0, W, H), f = frame.data;
    for (let p = 0, i = 0; p < W * H; p++, i += 4) {
      const luz = 0.8 + 0.3 * (p % W) / W;
      for (let ch = 0; ch < 3; ch++) f[i + ch] = f[i + ch] * luz + (Math.random() - 0.5) * 6;
    }
    ctx.putImageData(frame, 0, 0);
    return c;
  }

  // ---------- Inicio ----------
  const demo = makeDemo();
  loadStatic(demo, demo.width, demo.height);
  updateLabels();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
