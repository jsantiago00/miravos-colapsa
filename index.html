<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mirá vos · Visor</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #12151c;
    --panel-2: #1a1e28;
    --line: #262b38;
    --text: #e8ebf2;
    --muted: #8a92a6;
    --red: #ff3b3b;
    --cyan: #19e3ea;
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
  }
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  #stage { position: relative; flex: 1 1 auto; min-height: 0; background: #000; }
  #view {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; display: block;
  }
  #title {
    position: absolute; top: calc(var(--sat) + 10px); left: calc(var(--sal) + 12px);
    padding: 5px 12px; border-radius: 999px; background: #000a; border: 1px solid #ffffff22;
    font-size: 13px; font-weight: 700; letter-spacing: .02em;
  }
  #title span { color: var(--muted); font-weight: 500; }
  #frozenBadge {
    position: absolute; top: calc(var(--sat) + 10px); right: calc(var(--sar) + 12px);
    background: #ffdc00; color: #000; font-weight: 700; font-size: 12px;
    padding: 5px 12px; border-radius: 999px; letter-spacing: .05em; display: none;
  }
  #toast {
    position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%) scale(.95);
    background: #000d; border: 1px solid #ffffff33; border-radius: 14px;
    padding: 12px 18px; font-size: 16px; font-weight: 600; text-align: center;
    opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; max-width: 85%;
  }
  #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  #panel {
    flex: 0 0 auto; background: var(--panel); border-top: 1px solid var(--line);
    padding: 12px calc(var(--sar) + 12px) calc(var(--sab) + 12px) calc(var(--sal) + 12px);
    display: flex; flex-direction: column; gap: 10px;
  }
  #filters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .filter {
    min-height: 76px; border-radius: 16px; border: 2px solid var(--line);
    background: var(--panel-2); color: var(--text); font: inherit; font-size: 18px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .filter .sw { width: 28px; height: 28px; border-radius: 50%; }
  .filter[data-f="red"] .sw { background: var(--red); }
  .filter[data-f="cyan"] .sw { background: var(--cyan); }
  .filter[data-f="red"].active { border-color: var(--red); background: #3a1416; }
  .filter[data-f="cyan"].active { border-color: var(--cyan); background: #0f3436; }
  #actions { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; }
  .btn {
    min-height: 48px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); font: inherit; font-weight: 700; font-size: 14px;
  }
  .btn.primary { background: var(--text); color: #0b0d12; border-color: var(--text); }
  .btn.on { background: #ffdc00; color: #000; border-color: #ffdc00; }
  .btn:disabled { opacity: .4; }
  .btn:active, .filter:active { transform: scale(.97); }
  #fileInput { display: none; }

  @media (min-width: 700px) {
    #panel { max-width: 560px; width: 100%; margin: 0 auto; border-radius: 16px 16px 0 0; border: 1px solid var(--line); }
  }
  @media (orientation: landscape) and (max-height: 500px) {
    body { flex-direction: row; }
    #panel { width: 260px; border-top: 0; border-left: 1px solid var(--line); justify-content: center;
             padding-top: calc(var(--sat) + 12px); }
    #filters { grid-template-columns: 1fr; }
    #actions { grid-template-columns: 1fr 1fr; }
    #camBtn { grid-column: span 2; }
  }
</style>
</head>
<body>

<div id="stage">
  <canvas id="view"></canvas>
  <div id="title">Mirá vos <span id="source">· demo</span></div>
  <div id="frozenBadge">CONGELADO</div>
  <div id="toast"></div>
</div>

<div id="panel">
  <div id="filters">
    <button class="filter" data-f="red"><span class="sw"></span>Rojo</button>
    <button class="filter" data-f="cyan"><span class="sw"></span>Cian</button>
  </div>
  <div id="actions">
    <button class="btn primary" id="camBtn">Activar cámara</button>
    <button class="btn" id="freezeBtn" disabled>Congelar</button>
    <button class="btn" id="photoBtn">Sacar foto</button>
  </div>
  <input type="file" id="fileInput" accept="image/*" capture="environment">
</div>

<video id="video" playsinline muted autoplay style="display:none"></video>

<script>
(() => {
  'use strict';

  const MAX_SIDE = 720;

  const $ = id => document.getElementById(id);
  const view = $('view');
  const vctx = view.getContext('2d');
  const work = document.createElement('canvas');
  const wctx = work.getContext('2d', { willReadFrequently: true });
  const video = $('video');

  const state = {
    filter: null,       // null | 'red' | 'cyan'
    source: 'demo',     // 'demo' | 'camera' | 'photo'
    frozen: false,
    stream: null,
  };

  let raw = null;       // ImageData del frame original
  let out = null;       // ImageData procesada
  let lum = null;       // valores intermedios del filtro

  let toastTimer;
  function toast(msg, ms = 2200) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), ms);
  }

  function setSourceLabel() {
    const names = { demo: 'demo', camera: state.frozen ? 'pausado' : 'en vivo', photo: 'foto' };
    $('source').textContent = '· ' + names[state.source];
  }

  function setSize(w, h) {
    const k = Math.min(1, MAX_SIDE / Math.max(w, h));
    const W = Math.max(1, Math.round(w * k)), H = Math.max(1, Math.round(h * k));
    if (!out || work.width !== W || work.height !== H) {
      work.width = W; work.height = H;
      view.width = W; view.height = H;
      out = vctx.createImageData(W, H);
      lum = new Uint8Array(W * H);
    }
  }

  function loadStatic(img, w, h) {
    setSize(w, h);
    wctx.drawImage(img, 0, 0, work.width, work.height);
    raw = wctx.getImageData(0, 0, work.width, work.height);
    render();
  }

  // Simula mirar a través de celofán rojo o cian, con contraste automático.
  // Rojo: deja pasar R → lo cian/azul se ve oscuro.
  // Cian: deja pasar G+B → lo rojo/naranja se ve oscuro y lo cian/azul se ilumina.
  function render() {
    if (!raw) return;
    const s = raw.data, o = out.data, n = lum.length;
    if (!state.filter) {
      o.set(s);
      vctx.putImageData(out, 0, 0);
      return;
    }

    const red = state.filter === 'red';
    const hist = new Uint32Array(256);
    for (let p = 0, i = 0; p < n; p++, i += 4) {
      const v = red ? s[i] : (s[i + 1] + s[i + 2]) >> 1;
      lum[p] = v;
      hist[v]++;
    }

    // Estira entre los percentiles 1% y 99%
    let lo = 0, hi = 255, acc = 0;
    const cut = n * 0.01;
    for (; lo < 255; lo++) { acc += hist[lo]; if (acc > cut) break; }
    acc = 0;
    for (; hi > 0; hi--) { acc += hist[hi]; if (acc > cut) break; }
    if (hi - lo < 20) { lo = 0; hi = 255; }
    const k = 255 / (hi - lo);

    for (let p = 0, i = 0; p < n; p++, i += 4) {
      let v = (lum[p] - lo) * k;
      v = v < 0 ? 0 : v > 255 ? 255 : v;
      const t = v * 0.3;
      if (red) { o[i] = v; o[i + 1] = t; o[i + 2] = t; }
      else { o[i] = t; o[i + 1] = v; o[i + 2] = v; }
      o[i + 3] = 255;
    }
    vctx.putImageData(out, 0, 0);
  }

  function loop() {
    if (state.source === 'camera' && !state.frozen && video.readyState >= 2 && video.videoWidth) {
      setSize(video.videoWidth, video.videoHeight);
      wctx.drawImage(video, 0, 0, work.width, work.height);
      raw = wctx.getImageData(0, 0, work.width, work.height);
      render();
    }
    requestAnimationFrame(loop);
  }

  // ---------- Filtros ----------
  document.querySelectorAll('.filter').forEach(btn => {
    btn.addEventListener('click', () => {
      // Tocar el filtro activo lo apaga
      state.filter = state.filter === btn.dataset.f ? null : btn.dataset.f;
      document.querySelectorAll('.filter').forEach(b => b.classList.toggle('active', b.dataset.f === state.filter));
      render();
    });
  });

  // ---------- Cámara ----------
  async function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      toast('La cámara no está disponible. Usá "Sacar foto".', 3500);
      return;
    }
    $('camBtn').disabled = true;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
      });
      state.stream = stream;
      video.srcObject = stream;
      await video.play();
      state.source = 'camera';
      setFrozen(false);
      $('camBtn').textContent = 'Detener cámara';
      $('camBtn').classList.remove('primary');
      $('freezeBtn').disabled = false;
    } catch (err) {
      console.error(err);
      toast(err && err.name === 'NotAllowedError'
        ? 'Permiso de cámara denegado. Podés usar "Sacar foto".'
        : 'No se pudo abrir la cámara. Probá con "Sacar foto".', 3500);
    } finally {
      $('camBtn').disabled = false;
      setSourceLabel();
    }
  }

  function stopCamera() {
    if (state.stream) state.stream.getTracks().forEach(t => t.stop());
    state.stream = null;
    video.srcObject = null;
    $('camBtn').textContent = 'Activar cámara';
    $('camBtn').classList.add('primary');
    $('freezeBtn').disabled = true;
    setFrozen(false);
  }

  function setFrozen(f) {
    state.frozen = f;
    const b = $('freezeBtn');
    b.textContent = f ? 'Seguir' : 'Congelar';
    b.classList.toggle('on', f);
    $('frozenBadge').style.display = f ? 'block' : 'none';
    setSourceLabel();
  }

  $('camBtn').addEventListener('click', () => {
    if (state.stream) {
      stopCamera();
      state.source = 'photo'; // el último frame queda como imagen estática
      setSourceLabel();
    } else {
      startCamera();
    }
  });

  $('freezeBtn').addEventListener('click', () => {
    if (state.source === 'camera') setFrozen(!state.frozen);
  });

  // ---------- Foto (alternativa) ----------
  $('photoBtn').addEventListener('click', () => $('fileInput').click());
  $('fileInput').addEventListener('change', e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      if (state.stream) stopCamera();
      state.source = 'photo';
      loadStatic(img, img.naturalWidth, img.naturalHeight);
      URL.revokeObjectURL(url);
      setSourceLabel();
    };
    img.onerror = () => { URL.revokeObjectURL(url); toast('No se pudo leer la imagen'); };
    img.src = url;
  });

  // ---------- Imagen demo ----------
  function makeDemo() {
    const W = 720, H = 540;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const ctx = c.getContext('2d');

    ctx.fillStyle = '#f3e3dc';
    ctx.fillRect(0, 0, W, H);

    const arrowRight = new Path2D();
    arrowRight.moveTo(60, 230); arrowRight.lineTo(220, 230); arrowRight.lineTo(220, 170);
    arrowRight.lineTo(330, 280); arrowRight.lineTo(220, 390); arrowRight.lineTo(220, 330);
    arrowRight.lineTo(60, 330); arrowRight.closePath();

    const arrowUp = new Path2D();
    arrowUp.moveTo(505, 470); arrowUp.lineTo(505, 250); arrowUp.lineTo(440, 250);
    arrowUp.lineTo(555, 90); arrowUp.lineTo(670, 250); arrowUp.lineTo(605, 250);
    arrowUp.lineTo(605, 470); arrowUp.closePath();

    // Rojos, naranjas y rosas (h, s, l)
    const warm = [
      [355, 75, 55], [5, 80, 52], [15, 85, 55], [25, 90, 58], [32, 90, 60],
      [340, 70, 65], [330, 65, 70], [350, 60, 72], [10, 70, 45], [20, 60, 68],
    ];
    const rnd = (a, b) => a + Math.random() * (b - a);
    const pick = arr => arr[(Math.random() * arr.length) | 0];

    const step = 13;
    for (let gy = 0; gy < H + step; gy += step) {
      for (let gx = 0; gx < W + step; gx += step) {
        const x = gx + rnd(-4, 4) + (((gy / step) | 0) % 2 ? step / 2 : 0);
        const y = gy + rnd(-4, 4);
        let col;
        if (ctx.isPointInPath(arrowRight, x, y) && Math.random() < 0.6) {
          col = [185 + rnd(-6, 6), rnd(38, 55), rnd(55, 66)];
        } else if (ctx.isPointInPath(arrowUp, x, y) && Math.random() < 0.6) {
          col = [228 + rnd(-6, 6), rnd(38, 55), rnd(58, 68)];
        } else {
          const w = pick(warm);
          col = [w[0] + rnd(-5, 5), w[1] + rnd(-10, 10), w[2] + rnd(-6, 6)];
        }
        ctx.fillStyle = `hsl(${col[0]},${col[1]}%,${col[2]}%)`;
        ctx.beginPath();
        ctx.arc(x, y, rnd(3, 7.5), 0, Math.PI * 2);
        ctx.fill();
      }
    }
    return c;
  }

  // ---------- Inicio ----------
  const demo = makeDemo();
  loadStatic(demo, demo.width, demo.height);
  setSourceLabel();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
